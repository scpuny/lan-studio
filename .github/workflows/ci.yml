name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML for full contract verification
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Verify M0 contracts (full)
        run: python3 scripts/verify_contracts.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Build release artifact
        run: cargo build --release -p lan-mdns

      - name: Smoke test artifact (M2.1 runtime, isolated multicast)
        env:
          LAN_STUDIO_CONFIG: components/lan-mdns/config.template.yaml
          LAN_STUDIO_PORT: "18080"
          LAN_MDNS_PORT: "15353"
          LAN_MDNS_GROUP: "239.1.2.3"
        run: |
          set -e
          python3 scripts/smoke_mdns.py
          ./target/release/lan-mdns --cli | grep -q 'component=lan-mdns'
          echo 'SMOKE OK'

      - name: Assert single-file artifact
        run: |
          test -f target/release/lan-mdns
          echo "artifact bytes: $(stat -c %s target/release/lan-mdns)"
