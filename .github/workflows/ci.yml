name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  webui:
    name: WebUI (typescript + offline bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/lan-mdns/webui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: components/lan-mdns/webui/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (vue-tsc, strict)
        run: npm run typecheck

      - name: Build single-file console
        run: npx vite build

      - name: Render check (jsdom, catches blank pages)
        run: npm run check:render

      - name: Assert bundle is self-contained
        run: |
          set -e
          OUT=../../../common/webui/src/assets/index.html
          grep -q '<style' "$OUT"
          for pat in '<script src=' 'src="http://' 'src="https://' 'href="http://' 'href="https://' 'url(http://' 'url(https://'; do
            if grep -qF "$pat" "$OUT"; then
              echo "offline asset rule violated: $pat"
              exit 1
            fi
          done
          echo "bundle bytes: $(stat -c %s "$OUT")"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML for full contract verification
        run: python3 -m pip install --disable-pip-version-check pyyaml

      - name: Verify M0 contracts (full)
        run: python3 scripts/verify_contracts.py

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit tests
        run: cargo test --workspace

      - name: Build release artifact
        run: cargo build --release -p lan-mdns

      - name: API contract test (runtime conformance, F-J03)
        env:
          LAN_CONTRACT_MDNS_PORT: "25353"
          LAN_CONTRACT_MDNS_GROUP: "239.1.2.4"
        run: |
          set -e
          python3 -m py_compile scripts/test_api_contract.py
          python3 scripts/test_api_contract.py

      - name: Smoke test artifact (M2.1 + M2.2 + M2.3 runtime, isolated multicast)
        env:
          LAN_STUDIO_CONFIG: components/lan-mdns/config.template.yaml
          LAN_STUDIO_PORT: "18080"
          LAN_MDNS_PORT: "15353"
          LAN_MDNS_GROUP: "239.1.2.3"
        run: |
          set -e
          python3 -m py_compile scripts/smoke_mdns.py scripts/verify_contracts.py
          bash -n scripts/install.sh
          docker compose -f deploy/docker-compose.yml config -q
          python3 scripts/smoke_mdns.py
          TMP_CFG="$(mktemp)"
          LAN_STUDIO_CONFIG="$TMP_CFG" ./target/release/lan-mdns --cli | grep -q 'component=lan-mdns'
          LAN_STUDIO_CONFIG="$TMP_CFG" ./target/release/lan-mdns --validate
          ./target/release/lan-mdns --version | grep -q 'lan-mdns'
          ./target/release/lan-mdns --print-config | grep -q 'component: lan-mdns'
          echo 'SMOKE OK'

      - name: Assert single-file artifact
        run: |
          test -f target/release/lan-mdns
          echo "artifact bytes: $(stat -c %s target/release/lan-mdns)"
