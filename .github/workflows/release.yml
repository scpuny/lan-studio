name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        uses: taiki-e/install-action@cross

      - name: Build static binary
        run: cross build --release --target ${{ matrix.target }} -p lan-mdns

      - name: Package and checksum
        run: |
          set -e
          BIN="target/${{ matrix.target }}/release/lan-mdns"
          test -f "$BIN"
          file "$BIN" | grep -q 'statically linked'
          NAME="lan-mdns-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p dist
          cp "$BIN" dist/lan-mdns
          cp components/lan-mdns/config.template.yaml dist/config.template.yaml
          cp components/lan-mdns/README.md dist/README.md
          cp README.md dist/PROJECT-README.md
          tar -czf "$NAME.tar.gz" -C dist .
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          echo "packaged $NAME.tar.gz"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.tar.gz
            *.tar.gz.sha256
