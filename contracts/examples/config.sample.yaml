version: 1
component: lan-mdns

server:
  listen: "127.0.0.1"
  port: 8080
  webui: true
  admin_token: ""
  log_level: info

observability:
  metrics: true
  alerts: true
  history_limit: 30

logging:
  max_bytes: 1048576
  backup_count: 3
  level: info

alerts:
  enabled: true
  webhooks: []
  cooldown_seconds: 300
  timeout_seconds: 5.0
  max_retries: 2

mdns:
  group: "224.0.0.251"
  port: 5353
  ttl: 120
  announce_count: 3
  announce_interval_ms: 250
  announce_period_s: 60
  reverse_ptr: true
  interface_mode: auto
  interfaces: []
  health_targets: []
  records: []
  services: []
