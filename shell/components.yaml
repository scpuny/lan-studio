version: 1
# Lan Studio Shell manifest. Static discovery only (D-M5-2): no mDNS probing,
# no event bus, no data aggregation. Optional bounded /healthz checks below.
probe_enabled: true
probe_interval_seconds: 15
probe_timeout_ms: 300
components:
  - name: lan-mdns
    label: 名称解析与服务发现
    port: 8080
    icon: dns
    tone: blue
  - name: lan-relay
    label: 跨网段中继
    port: 8081
    icon: relay
    tone: cyan
  - name: lan-ca
    label: 内网凭证
    port: 8082
    icon: cert
    tone: purple
  - name: lan-scan
    label: 资产探查
    port: 8083
    icon: scan
    tone: teal
  - name: lan-hosts
    label: 静态名字映射
    port: 8084
    icon: hosts
    tone: indigo
  - name: lan-wol
    label: 网络唤醒
    port: 8085
    icon: power
    tone: amber
  - name: lan-sync
    label: 配置同步
    port: 8086
    icon: sync
    tone: green
  - name: lan-ssdp
    label: 设备发现
    port: 8087
    icon: discover
    tone: orange
