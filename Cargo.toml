[workspace]
resolver = "2"
members = [
    "common/config",
    "common/crypto",
    "common/alert",
    "common/dns",
    "common/net",
    "common/log",
    "common/health",
    "common/auth",
    "common/metrics",
    "common/webui",
    "common/api",
    "common/component",
    "common/probe",
    "components/lan-mdns",
    "components/lan-relay",
    "components/lan-ca",
    "components/lan-scan",
    "components/lan-hosts",
    "components/lan-wol",
    "components/lan-sync",
    "components/lan-ssdp",
    "shell",
    "lan-webui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
common-config = { path = "common/config" }
common-crypto = { path = "common/crypto" }
common-alert = { path = "common/alert" }
common-dns = { path = "common/dns" }
common-net = { path = "common/net" }
common-log = { path = "common/log" }
common-health = { path = "common/health" }
common-auth = { path = "common/auth" }
common-metrics = { path = "common/metrics" }
common-webui = { path = "common/webui" }
common-api = { path = "common/api" }
common-component = { path = "common/component" }
common-probe = { path = "common/probe" }
