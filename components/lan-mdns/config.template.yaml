version: 1
component: lan-mdns

server:
  listen: "127.0.0.1"
  port: 8080
  webui: true
  admin_token: ""
  log_level: info

observability:
  metrics: true
  alerts: true
  history_limit: 30

logging:
  max_bytes: 1048576
  backup_count: 3
  level: info

alerts:
  enabled: true
  # Canonical events are adapted centrally by common-alert. Supported targets:
  # dingtalk / feishu / slack / wecom / any generic JSON endpoint.
  # Example (block list; inline ["url"] is accepted too):
  # webhooks:
  #   - "https://oapi.dingtalk.com/robot/send?access_token=..."
  webhooks: []
  cooldown_seconds: 300
  timeout_seconds: 5.0
  max_retries: 2

mdns:
  group: "224.0.0.251"
  port: 5353
  ttl: 120
  announce_count: 3
  announce_interval_ms: 250
  announce_period_s: 60
  reverse_ptr: true
  interface_mode: auto
  interfaces: []

  # Business health targets (TCP probes), NOT the /healthz liveness probe.
  # Each entry: { alias, host, port }. Empty by default so no LAN traffic is
  # generated out of the box; see docs/M2-CHECKLIST.md F-D03.
  health_targets: []

  records:
    - name: nas.local
      type: A
      value: 192.168.5.10
    - name: nas.local
      type: AAAA
      value: fe80::1
    - name: box.local
      type: TXT
      value: env=lab

  services:
    - instance: Web Server
      type: _http._tcp.local
      host: nas.local
      port: 8080
      # F-H02 per-service gateway switch (ignored while gateway.enabled=false).
      proxy: true
      txt:
        path: /
        version: "1"

  # M2.3 built-in HTTP gateway. OFF by default so port 80 is never claimed
  # implicitly. PRD 1.4: only explicitly registered names are ever routed.
  # A published service whose host has an A record becomes a route
  # automatically; gateway.hosts[] can add or override the target.
  gateway:
    enabled: false
    port: 80
    listen: "0.0.0.0"
    admin_host: "mdns.local"
    timeout_seconds: 6.0
    hosts: []
    # - host: printer.local
    #   target: "192.168.5.30:80"
    #   proxy: true
